# Roasts the commit messages in every pull request and posts the result as a PR comment.
# Setup: repo Settings > Secrets and variables > Actions > New repository secret
#   DIFY_API_KEY   your Dify app key (app-...)
# Optional repository variable DIFY_BASE_URL if you self-host Dify.

name: Roast PR commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: roast-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  roast:
    runs-on: ubuntu-latest
    env:
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_BASE_URL: ${{ vars.DIFY_BASE_URL || 'https://api.dify.ai/v1' }}
    steps:
      - name: Skip when the Dify key is unavailable
        if: env.DIFY_API_KEY == ''
        run: echo "::notice::DIFY_API_KEY secret is not set (or this PR comes from a fork), so no roast this time."

      - uses: actions/checkout@v7
        if: env.DIFY_API_KEY != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: env.DIFY_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.DIFY_API_KEY != ''
        run: pip install -r requirements.txt

      - name: Roast the commits in this PR
        if: env.DIFY_API_KEY != ''
        # A Dify outage or rate limit should not block merging.
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COLUMNS: "120"
        run: python roast.py --range "$BASE_SHA..$HEAD_SHA" --output roast.md

      - name: Post or update the PR comment
        if: env.DIFY_API_KEY != '' && hashFiles('roast.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- commit-roaster -->";
            const body = `${marker}\n## 🔥 Commit Roast\n\n${fs.readFileSync("roast.md", "utf8")}\n\n<sub>Generated by Commit Roaster for ${context.payload.pull_request.head.sha.slice(0, 7)}</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
